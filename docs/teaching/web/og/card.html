<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f5f6f8;font-family:"Noto Sans TC",sans-serif;color:#1c2230}
.card{position:relative;width:1200px;height:630px;background:#fff;display:grid;grid-template-columns:1fr 470px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:#22355b}
.txt{padding:62px 0 0 78px;position:relative;z-index:1}
.kick{font-size:24px;font-weight:700;color:#0f777b;letter-spacing:.12em}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:66px;line-height:1.22;margin:14px 0 18px;letter-spacing:.02em}
.sub{font-size:28px;color:#5d6678;font-weight:500}
.case{display:inline-block;margin-top:22px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:40px;color:#fff;background:#0f777b;padding:8px 24px;border-radius:8px;box-shadow:7px 7px 0 #e8a900}
.steps{position:absolute;left:78px;bottom:46px;display:flex;gap:12px}
.steps b{font-family:"Noto Serif TC",serif;font-size:28px;width:58px;height:58px;display:grid;place-items:center;border-radius:10px;background:#e8edf6;color:#22355b}
.steps b.on{background:#22355b;color:#fff}
.who{position:relative;overflow:hidden;background:#fff}
.who img{position:absolute;bottom:-10px}
.al{left:-40px;height:560px}
.ar{right:-30px;height:450px}
.credit{position:absolute;left:78px;bottom:40px}
.credit .l1{display:flex;align-items:center;gap:14px}
.credit .cl{font-size:20px;font-weight:700;color:#22355b;border:2px solid #22355b;border-radius:6px;padding:2px 12px}
.credit b{font-size:30px;font-weight:700;color:#1c2230}
.credit .l2{margin-top:8px;font-size:22px;color:#0f777b;font-weight:500;letter-spacing:.01em}
.tag{position:absolute;right:28px;top:30px;font-size:20px;color:#5d6678;font-weight:700}
</style></head><body>
<div class="card">
  <div class="txt">
    <div class="kick">教學個案・Allan × AI 小助理阿拉蕾</div>
    <h1>AI開發個案-<br>資安情資蒐集自動化</h1>
    <div class="sub">用 AI 協作打造一條 PDCA 資料管線</div>
    <div class="case">會自我檢查的自動化</div>
  </div>
  <div class="who">
    <img class="al" src="allan.png" alt="">
    <img class="ar" src="arale.png" alt="">
  </div>
  <div class="credit"><div class="l1"><span class="cl">無私分享／個案設計</span><b>Allan Lo</b></div><div class="l2">allanlo.plus@gmail.com　・　www.123hi.org</div></div>
</div>
</body></html>
